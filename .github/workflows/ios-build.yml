name: Build iOS (IPA & Simulator)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Setup Java Path for Xcode Build Phases
        run: |
          sudo ln -sfn "$JAVA_HOME/bin/java" /usr/local/bin/java
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

      - name: Verify Xcode & Java Versions
        run: |
          xcodebuild -version
          java -version

      - name: Compile Kotlin Multiplatform Framework
        run: |
          ./gradlew :shared:compileKotlinIosArm64
          ./gradlew :shared:compileKotlinIosSimulatorArm64

      - name: Build iOS App for Physical Devices (Unsigned IPA)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            JAVA_HOME="$JAVA_HOME" \
            PATH="$JAVA_HOME/bin:$PATH"

          # Package .app bundle into standard IPA structure dynamically
          APP_PATH=$(find build/device/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qr VoltUp-iOS-Device.ipa Payload
          cd ../..

      - name: Build iOS App for Simulator
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            JAVA_HOME="$JAVA_HOME" \
            PATH="$JAVA_HOME/bin:$PATH"

          # Compress simulator app bundle for drag-and-drop testing
          SIM_APP_PATH=$(find build/simulator/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found simulator app at: $SIM_APP_PATH"
          cd "$(dirname "$SIM_APP_PATH")"
          zip -qr ../../../../VoltUp-iOS-Simulator.app.zip "$(basename "$SIM_APP_PATH")"
          cd ../../../..

      - name: Upload iOS Device IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoltUp-iOS-Device-IPA
          path: build/ipa/VoltUp-iOS-Device.ipa
          retention-days: 14

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: VoltUp-iOS-Simulator-App
          path: VoltUp-iOS-Simulator.app.zip
          retention-days: 14
