name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Wersja tagu wydania (np. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Tytuł wydania (opcjonalnie, np. HealthUp v1.0.0)'
        required: false
        default: ''
      draft:
        description: 'Utwórz jako wersję roboczą (Draft)'
        type: boolean
        default: false
      prerelease:
        description: 'Oznacz jako wersję przedpremierową (Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Packages (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Prepare Android Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n' | base64 --decode > androidApp/google-services.json
            mkdir -p androidApp/src/main/assets
            cp androidApp/google-services.json androidApp/src/main/assets/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret is not configured; Firebase will remain disabled."
          fi

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not configured; release artifacts will remain unsigned."
          fi

      - name: Build Android APKs & AAB Bundle
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug :androidApp:bundleRelease

      - name: Organize Android Artifacts
        run: |
          mkdir -p build/release-assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk build/release-assets/HealthUp-Android-debug.apk
          if [ -f androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-release.apk build/release-assets/HealthUp-Android-release.apk
          elif [ -f androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk build/release-assets/HealthUp-Android-release-unsigned.apk
          fi
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab build/release-assets/HealthUp-Android-release.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: build/release-assets/
          retention-days: 1

      - name: Clean up Temporary Android Secrets
        if: always()
        run: |
          rm -f androidApp/google-services.json androidApp/src/main/assets/google-services.json secrets.properties "$RUNNER_TEMP/release.keystore"

  build-ios:
    name: Build iOS Packages (IPA & Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Setup Java Path for Xcode Build Phases
        run: |
          sudo ln -sfn "$JAVA_HOME/bin/java" /usr/local/bin/java
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

      - name: Verify Xcode & Java Versions
        run: |
          xcodebuild -version
          java -version

      - name: Prepare iOS Secrets
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | tr -d '\r\n' | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
          else
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is not configured; skipping GoogleService-Info.plist."
          fi

      - name: Compile Kotlin Multiplatform Framework
        run: |
          ./gradlew :shared:compileKotlinIosArm64
          ./gradlew :shared:compileKotlinIosSimulatorArm64

      - name: Build iOS App for Physical Devices (Unsigned IPA)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            JAVA_HOME="$JAVA_HOME" \
            PATH="$JAVA_HOME/bin:$PATH"

          APP_PATH=$(find build/device/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found device app at: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qr "$GITHUB_WORKSPACE/HealthUp-iOS-Device.ipa" Payload)

      - name: Build iOS App for Simulator
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            JAVA_HOME="$JAVA_HOME" \
            PATH="$JAVA_HOME/bin:$PATH"

          SIM_APP_PATH=$(find build/simulator/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found simulator app at: $SIM_APP_PATH"
          APP_DIR=$(dirname "$SIM_APP_PATH")
          APP_NAME=$(basename "$SIM_APP_PATH")
          (cd "$APP_DIR" && zip -qr "$GITHUB_WORKSPACE/HealthUp-iOS-Simulator.app.zip" "$APP_NAME")

      - name: Organize iOS Artifacts
        run: |
          mkdir -p build/release-assets
          cp "$GITHUB_WORKSPACE/HealthUp-iOS-Device.ipa" build/release-assets/HealthUp-iOS-Device.ipa
          cp "$GITHUB_WORKSPACE/HealthUp-iOS-Simulator.app.zip" build/release-assets/HealthUp-iOS-Simulator.app.zip
          echo "Organized release assets:"
          ls -la build/release-assets/

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-assets
          path: build/release-assets/
          retention-days: 1

      - name: Clean up Temporary iOS Secrets
        if: always()
        run: rm -f iosApp/iosApp/GoogleService-Info.plist

  publish-release:
    name: Create & Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: dist-android

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release-assets
          path: dist-ios

      - name: Consolidate Release Assets
        run: |
          mkdir -p dist
          cp dist-android/* dist/
          cp dist-ios/* dist/
          echo "=== Pliki do załączenia w wydaniu GitHub Release ==="
          ls -lh dist/

      - name: Determine Release Metadata
        id: meta
        env:
          GITHUB_REF_TYPE_VAL: ${{ github.ref_type }}
          GITHUB_REF_NAME_VAL: ${{ github.ref_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          if [ "$GITHUB_REF_TYPE_VAL" = "tag" ]; then
            TAG_NAME="$GITHUB_REF_NAME_VAL"
          elif [ -n "$INPUT_TAG_NAME" ]; then
            TAG_NAME="$INPUT_TAG_NAME"
          else
            TAG_NAME="v1.0.0"
          fi

          if [ -n "$INPUT_RELEASE_NAME" ]; then
            RELEASE_NAME="$INPUT_RELEASE_NAME"
          else
            RELEASE_NAME="HealthUp ${TAG_NAME}"
          fi

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: dist/*
